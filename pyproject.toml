[project]
name = "chat-responder"
version = "0.1.0"
description = "Real-time group-chat responder scoring: given a message, output a probability distribution over who should respond next (sums to 1)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
]
dev = ["pytest>=8.0"]

[project.scripts]
chat-responder = "chatresponder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatresponder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
