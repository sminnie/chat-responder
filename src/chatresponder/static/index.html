<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chat-responder</title>
<style>
  :root {
    --bg: #1a1d21; --panel: #121016; --line: #35373b; --text: #d1d2d3;
    --muted: #9a9b9e; --accent: #1164a3; --bubble: #222529;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; color: var(--text); background: var(--bg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  aside { width: 240px; background: var(--panel); padding: 16px; overflow-y: auto; flex-shrink: 0; }
  aside h1 { font-size: 15px; margin: 0 0 16px; color: #fff; }
  aside h2 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; letter-spacing: .05em; }
  .member { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; border-radius: 6px; }
  .member:hover { background: #2422281f; }
  .member.active { color: #fff; font-weight: 600; }
  .avatar {
    width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  header strong { color: #fff; }
  header button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #feed { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { display: flex; gap: 10px; padding: 6px 0; }
  .msg .body { min-width: 0; }
  .msg .name { color: #fff; font-weight: 700; font-size: 14px; }
  .msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .picks { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pick { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; }
  .pick.top { color: #fff; border-color: var(--accent); background: #1164a333; }
  .msg.bot .body { border-left: 2px solid var(--accent); padding-left: 10px; }
  .badge { font-size: 10px; font-weight: 700; background: var(--line); color: var(--muted); border-radius: 3px; padding: 1px 5px; margin-left: 6px; }
  .latency { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .empty { color: var(--muted); padding: 24px 0; }
  form { display: flex; gap: 8px; padding: 12px 20px 20px; border-top: 1px solid var(--line); }
  form input {
    flex: 1; background: var(--bubble); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 14px; color: var(--text); font: inherit;
  }
  form input:focus { outline: none; border-color: #565856; }
  form button { background: var(--accent); border: 0; color: #fff; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <h1>#group-chat</h1>
  <h2>Send as</h2>
  <div id="members"></div>
  <h2>Profiles</h2>
  <div id="profiles" style="font-size:12px;color:var(--muted)"></div>
</aside>
<main>
  <header>
    <div><strong>#group-chat</strong> <span style="color:var(--muted)">— who should reply next?</span></div>
    <button id="reset">Clear</button>
  </header>
  <div id="feed"></div>
  <form id="composer">
    <input id="text" autocomplete="off" placeholder="Message #group-chat" />
    <button type="submit">Send</button>
  </form>
</main>
<script>
const PALETTE = ["#e01e5a", "#2eb67d", "#ecb22e", "#36c5f0", "#a970ff", "#f2711c"];
const BOT_COLOR = "#1164a3";
let roles = [];
let botName = "Responder";
let sender = null;

const colorOf = (name) =>
  name === botName
    ? BOT_COLOR
    : PALETTE[roles.findIndex(r => r.name === name) % PALETTE.length];

function avatar(name) {
  const el = document.createElement("div");
  el.className = "avatar";
  el.style.background = colorOf(name);
  el.textContent = name.slice(0, 1).toUpperCase();
  return el;
}

function renderSidebar() {
  const members = document.getElementById("members");
  members.replaceChildren();
  for (const role of roles) {
    const row = document.createElement("div");
    row.className = "member" + (role.name === sender ? " active" : "");
    row.append(avatar(role.name), document.createTextNode(role.name));
    row.onclick = () => { sender = role.name; renderSidebar(); };
    members.append(row);
  }
  const bot = document.createElement("div");
  bot.className = "member";
  bot.style.cursor = "default";
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = "BOT";
  bot.append(avatar(botName), document.createTextNode(botName), badge);
  members.append(bot);

  const profiles = document.getElementById("profiles");
  profiles.replaceChildren();
  for (const role of roles) {
    const p = document.createElement("p");
    p.style.margin = "0 0 8px";
    const b = document.createElement("b");
    b.style.color = "var(--text)";
    b.textContent = role.name + ": ";
    p.append(b, document.createTextNode(role.profile));
    profiles.append(p);
  }
}

function renderEmpty() {
  const feed = document.getElementById("feed");
  if (!feed.children.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No messages yet. Pick a sender on the left and start typing.";
    feed.append(p);
  }
}

function addMessage(entry) {
  const feed = document.getElementById("feed");
  feed.querySelector(".empty")?.remove();
  const isBot = entry.kind === "bot";
  const row = document.createElement("div");
  row.className = "msg" + (isBot ? " bot" : "");
  const body = document.createElement("div");
  body.className = "body";
  const head = document.createElement("div");
  head.className = "name";
  head.textContent = entry.sender;
  if (isBot) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "BOT";
    head.append(badge);
    if (entry.latency_ms != null) {
      const timing = document.createElement("span");
      timing.className = "latency";
      timing.textContent = `${entry.latency_ms} ms (avg ${entry.avg_latency_ms} ms)`;
      head.append(timing);
    }
  }
  const msg = document.createElement("div");
  msg.className = "text";
  msg.textContent = entry.text;
  body.append(head, msg);
  if (entry.suggestions?.length) {
    const picks = document.createElement("div");
    picks.className = "picks";
    entry.suggestions.forEach((s, i) => {
      const tag = document.createElement("span");
      tag.className = "pick" + (i === 0 ? " top" : "");
      tag.textContent = `${s.name} ${s.score.toFixed(2)}`;
      picks.append(tag);
    });
    body.append(picks);
  }
  row.append(avatar(entry.sender), body);
  feed.append(row);
  feed.scrollTop = feed.scrollHeight;
}

async function load() {
  const state = await (await fetch("/api/state")).json();
  roles = state.roles;
  botName = state.bot;
  sender = sender ?? roles[0]?.name;
  renderSidebar();
  document.getElementById("feed").replaceChildren();
  for (const m of state.messages) addMessage(m);
  renderEmpty();
}

document.getElementById("composer").onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text || !sender) return;
  input.value = "";
  const res = await fetch("/api/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sender, text }),
  });
  const bot = await res.json();
  if (!res.ok) { alert(bot.error); return; }
  addMessage({ sender, text, kind: "user" });
  addMessage(bot);
  const next = bot.suggestions?.[0]?.name;
  if (next) { sender = next; renderSidebar(); }
  input.focus();
};

document.getElementById("reset").onclick = async () => {
  await fetch("/api/reset", { method: "POST" });
  await load();
};

load();
</script>
</body>
</html>
